# ThaiSLM gateway: one origin for the browser (camera needs a secure context → http://localhost is fine).
#   /            → web (Next.js)
#   /api/        → sign-api (scaled replicas are resolved through Docker DNS on every request)
#   /tts/        → tts
worker_processes auto;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 200m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  gzip on;
  gzip_types application/json text/css application/javascript;
  server {
    listen 80;
    set $web http://web:3000;
    set $api http://sign-api:8000;
    set $tts http://tts:8001;
    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_buffering off;          # progress lines of /stream endpoints reach the browser as they are written
    }
    location /tts/ {
      rewrite ^/tts/(.*)$ /$1 break;
      proxy_pass $tts;
    }
    location / {
      proxy_pass $web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
