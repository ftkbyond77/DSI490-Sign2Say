# ThaiSLM gateway: ONE origin for the browser, both directions (camera / microphone need a secure context → http://localhost is fine).
#   /               → web (Next.js: every screen)
#   /api/           → sign-api (scaled replicas are resolved through Docker DNS on every request)
#   /tts/           → tts
#   /t2s/           → reverse-api /api/ (text / speech → sign: translate, motion, speech recognition)
#   /avatars/       → the avatar characters (optimised copies + thumbnails from reverse-api's cache; /avatars/src/ = original files)
#   /avatar.vrm     → the library avatar (fallback)
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { model/gltf-binary vrm vrma glb; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 200m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;
  sendfile on;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 800;
  gzip_types application/json text/css application/javascript model/gltf-binary;
  server {
    listen 80;
    set $web http://web:3000;
    set $api http://sign-api:8000;
    set $tts http://tts:8001;
    set $t2s http://reverse-api:8001;
    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_buffering off;          # progress lines of /stream endpoints reach the browser as they are written
    }
    location ~ ^/(models|mediapipe)/ {   # MediaPipe WASM + models (≈ 26 MB): kept by the browser for a week instead of re-checked every visit
      proxy_pass $web;
      proxy_set_header Host $host;
      proxy_hide_header Cache-Control;
      add_header Cache-Control "public, max-age=604800";
    }
    location /tts/ {
      rewrite ^/tts/(.*)$ /$1 break;
      proxy_pass $tts;
    }
    location /t2s/ {
      rewrite ^/t2s/(.*)$ /api/$1 break;
      proxy_pass $t2s;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_read_timeout 90s;
    }
    location /avatars/src/ {              # a character's original file while its optimised copy is being made (?v=content hash)
      alias /srv/vrm/;
      add_header Cache-Control "public, max-age=86400";
    }
    location /avatars/ {                  # optimised characters + thumbnails, content-addressed names → cache forever
      root /srv;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /avatar.vrm {
      alias /srv/avatar.vrm;
      add_header Cache-Control "public, max-age=86400";
    }
    location / {
      proxy_pass $web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
