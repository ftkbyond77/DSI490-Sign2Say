const EMOS=["neutral","happy","sad","angry","fear","disgust","surprise"], TH={"neutral": "เป็นกลาง", "happy": "ดีใจ", "sad": "เศร้า", "angry": "โกรธ", "fear": "กลัว", "disgust": "รังเกียจ", "surprise": "ประหลาดใจ"};
const rnd=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let who="",mode="",order=[],i=0,res=[];const app=document.getElementById('app');
function home(){app.innerHTML=`<div class=card><p>ชื่อเล่นผู้ฟัง (ไม่บังคับ): <input id=nm style="font-size:1em;padding:.3em"></p>
<p><b>ส่วน 1 — ทายอารมณ์</b> (${ID.length} ข้อ): ฟังเสียงแล้วเลือกว่าเป็นอารมณ์ไหนจาก 7 อารมณ์ (ชาย+หญิง)<br><button class=p onclick="go('id')">เริ่มส่วน 1</button></p>
<p><b>ส่วน 2 — เทียบวิธีเดิมกับปัจจุบัน</b> (${AB.length} ข้อ): ดีใจ/โกรธ ฟัง A/B แล้วเลือกอันที่ชัดกว่า (ซ่อนว่าอันไหนเก่า/ใหม่)<br><button class=p onclick="go('ab')">เริ่มส่วน 2</button></p>
<small>ใช้หูฟังจะดีที่สุด ผลไม่ถูกส่งไปไหน ดาวน์โหลดเป็น CSV ตอนจบ</small></div>`}
function go(m){who=document.getElementById('nm').value||'anon';mode=m;i=0;res=[];order=m=='id'?rnd(ID):rnd(AB).map(t=>({...t,flip:Math.random()<.5}));show()}
function show(){if(i>=order.length)return done();const t=order[i];
 if(mode=='id'){app.innerHTML=`<progress value=${i} max=${order.length}></progress><small> ข้อ ${i+1}/${order.length}</small>
 <div class=card><p>ประโยค: <b>${t.text}</b></p><audio controls src="${t.file}"></audio><p>ฟังเป็นอารมณ์ไหน?</p>
 ${EMOS.map(e=>`<button onclick="pickId('${e}')">${TH[e]}</button>`).join('')}</div>`}
 else{const A=t.flip?t.new:t.old,B=t.flip?t.old:t.new;
 app.innerHTML=`<progress value=${i} max=${order.length}></progress><small> ข้อ ${i+1}/${order.length}</small>
 <div class=card><p>ประโยค: <b>${t.text}</b> · อารมณ์ที่ถาม: <b>${t.th}</b></p>
 <div class=row><div class=opt><b>A</b><br><audio controls src="${A}"></audio></div><div class=opt><b>B</b><br><audio controls src="${B}"></audio></div></div>
 <p>อันไหนฟังเป็น <b>${t.th}</b> ชัดกว่า?</p><button class=p onclick="pickAb('A')">A ชัดกว่า</button><button class=p onclick="pickAb('B')">B ชัดกว่า</button><button onclick="pickAb('same')">ไม่ต่างกัน</button></div>`}}
function pickId(c){const t=order[i];res.push({who,part:'id',spk:t.spk,gender:t.gender,sent:t.sent,truth:t.emo,answer:c,correct:c==t.emo?1:0});i++;show()}
function pickAb(c){const t=order[i];const w=c==='same'?'same':((c==='A')===!t.flip?'old':'new');res.push({who,part:'ab',spk:t.spk,gender:t.gender,sent:t.sent,emo:t.emo,choice:c,winner:w});i++;show()}
function done(){let h="";
 if(mode=='id'){const by={},g={};res.forEach(r=>{by[r.truth]=by[r.truth]||{n:0,c:0};by[r.truth].n++;by[r.truth].c+=r.correct;g[r.gender]=g[r.gender]||{n:0,c:0};g[r.gender].n++;g[r.gender].c+=r.correct});
  const tot=res.reduce((a,r)=>a+r.correct,0);
  h=`<h3>ผลส่วน 1: ถูก ${tot}/${res.length} (สุ่ม ≈ ${(res.length/7).toFixed(1)})</h3><table><tr><th>อารมณ์จริง</th><th>ถูก</th></tr>`+EMOS.filter(e=>by[e]).map(e=>`<tr><td>${TH[e]}</td><td>${by[e].c}/${by[e].n}</td></tr>`).join('')+`</table><p>`+Object.entries(g).map(([k,v])=>`${k==='female'?'หญิง':'ชาย'}: ${v.c}/${v.n}`).join(' · ')+`</p>`;}
 else{const by={},tot={old:0,new:0,same:0};res.forEach(r=>{by[r.emo]=by[r.emo]||{old:0,new:0,same:0};by[r.emo][r.winner]++;tot[r.winner]++});
  h=`<h3>ผลส่วน 2</h3><table><tr><th>อารมณ์</th><th>เดิม</th><th>ปัจจุบัน</th><th>ไม่ต่าง</th></tr>`+Object.entries(by).map(([k,v])=>`<tr><td>${TH[k]}</td><td>${v.old}</td><td>${v.new}</td><td>${v.same}</td></tr>`).join('')+`<tr><th>รวม</th><th>${tot.old}</th><th>${tot.new}</th><th>${tot.same}</th></tr></table>`;}
 const keys=Object.keys(res[0]||{});const csv=keys.join(',')+"\n"+res.map(r=>keys.map(k=>r[k]).join(',')).join("\n");
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
 app.innerHTML=`<div class=card><h3>เสร็จแล้ว ขอบคุณครับ</h3>${h}<p><a download="${mode}_${who}.csv" href="${url}"><button class=p>ดาวน์โหลดผล (CSV)</button></a><button onclick="home()">กลับหน้าแรก</button></p></div>`}
home();
</script>
