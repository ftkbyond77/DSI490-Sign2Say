# ThaiSLM web demo — `docker compose up --build`, then open http://localhost:8080 (ONE site for both directions)
#   gateway  nginx, the only published port (8080) — / → web, /api → sign-api, /tts → tts, /t2s → reverse-api, /avatars → character files
#   web      Next.js front end, both directions: camera + MediaPipe Holistic in the browser (sign → text / speech) and the
#            three-vrm signing avatar (text / speech → sign); screens /, /sign, /sign/live, /text, /chat (Figma “ThaiSLM v2”)
#   sign-api FastAPI + ONNX Runtime: landmarks or video → words / Thai sentence (stateless; scale with --scale sign-api=N)
#   (+ the reverse part's back end: reverse-api / reverse-speech — see the block at the end)
#   tts      FastAPI speech v2 (models/speech-model-v2): forward result → what to say (natural hesitation for unread signs, never a
#            guessed word) → MMS-TTS Thai (VITS, CPU) with the voice's fillers
#   tts-gpu  (profile `gpu`, opt-in: `docker compose --profile gpu up`) the same service with the F5-TTS-THAI voice on an NVIDIA GPU;
#            sign-api tries it first and falls back to `tts` automatically (TTS_URL list)
# The forward model is read from ./models/model-v10 (mounted read-only; rollback to v9 with ONE variable:
# THAISLM_MODELS_DIR=./models/model-v9 docker compose up), the face emotion model from ./models/face-model;
# OPENAI_API_KEY in .env enables the LLM sentence layer (rules otherwise).
name: thaislm
services:
  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./webapp/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse_text2sign/models/avatar.vrm:/srv/avatar.vrm:ro   # the library avatar (fallback when the API lists no characters)
      - ./reverse_text2sign/vrm:/srv/vrm:ro                       # character picker: original files (until optimised)
      - reverse-avatars:/srv/avatars:ro                           # optimised copies + thumbnails written by reverse-api
    ports:
      - "8080:80"
    depends_on:
      web:
        condition: service_started
      sign-api:
        condition: service_healthy
      reverse-api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: webapp/web/Dockerfile
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  sign-api:
    build:
      context: .
      dockerfile: webapp/api/Dockerfile
    volumes:
      - ${THAISLM_MODELS_DIR:-./models/model-v10}:/app/models:ro
      - ./models/face-model:/app/face-model:ro          # v9 face emotion model (separate folder)
      - ./cache/live_requests:/app/requests          # diagnosis: each utterance's landmarks + result (no video); set THAISLM_SAVE_REQUESTS= to turn off
    environment:
      - THAISLM_MODELS=/app/models
      - THAISLM_FACE_MODEL=/app/face-model
      - THAISLM_SAVE_REQUESTS=${THAISLM_SAVE_REQUESTS-/app/requests}
      - TTS_URL=http://tts-gpu:8001,http://tts:8001      # GPU voice first (profile gpu), CPU voice otherwise
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - OPENAI_TIMEOUT_S=8
      - ORT_THREADS=${ORT_THREADS:-8}           # 8 threads: 10 s utterance encoder 631 → 427 ms (measured)
    restart: unless-stopped

  tts:
    build:
      context: .
      dockerfile: webapp/tts/Dockerfile
    volumes:
      - ./models/speech-model-v2:/app/speech-model:ro   # emotion references + hesitation fillers (speech v2)
    restart: unless-stopped

  tts-gpu:
    profiles: ["gpu"]
    build:
      context: .
      dockerfile: webapp/tts/Dockerfile.gpu
    volumes:
      - ./models/speech-model-v2:/app/speech-model:ro
      - tts-hf:/app/hf                                  # F5-TTS-THAI + vocoder weights (downloaded once)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

# ---- reverse part's back end: Thai / English text or speech → Thai Sign Language avatar (reverse_text2sign/)
  # Its front end is now part of `web` (/text, /chat); the old stand-alone page (reverse-web, :8081) is no longer started —
  # its source stays in reverse_text2sign/service/web/ for reference.
  #   reverse-api     FastAPI: text → TSL structure (IR) → motion timeline from the recorded-sign library (models mounted read-only)
  #   reverse-speech  Thai / English speech recognition (Whisper, CTranslate2 int8) + English → Thai translation (NLLB-200 600M)
  reverse-api:
    build:
      context: .
      dockerfile: reverse_text2sign/service/api/Dockerfile
    volumes:
      - ./reverse_text2sign/models:/app/models:ro
      - ./reverse_text2sign/vrm:/app/vrm:ro                       # every *.vrm here is a selectable character (any file name)
      - reverse-avatars:/cache/avatars
    environment:
      - T2S_MODELS=/app/models
      - T2S_VRM_DIR=/app/vrm
      - T2S_AVATAR_CACHE=/cache/avatars
      - T2S_SPEECH_URL=http://reverse-speech:8002
    restart: unless-stopped

  reverse-speech:
    build:
      context: .
      dockerfile: reverse_text2sign/service/speech/Dockerfile
    environment:
      - SPEECH_THREADS=${T2S_SPEECH_THREADS:-4}
    restart: unless-stopped

volumes:
  tts-hf:                   # tts-gpu: Hugging Face weights cache
  reverse-avatars:          # reverse part: content-addressed optimised characters (rebuilt automatically if deleted)
