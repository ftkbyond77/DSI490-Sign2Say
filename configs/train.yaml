# Hyper-parameters actually used in result_v1 (CLI flags of scripts/experiments.py mirror these).
splits:
  unit: sign_variant_id
  cross_signer_fracs: {train_pairs: 0.2, E2_unseen_val: 0.1, E2_unseen_test: 0.1, E1_seen_val: 0.3, E1_seen_test: 0.3}
  signer_inventory: {method: face_cluster_then_name_vote, cluster_thr: 0.45}

normalization: {method: nap, fit_on: train_split_active_frames, dims_selected: 2}

ssl:                                # tag ssl_v1
  streams: [hand_l, hand_r, face, pose]
  d_model: 256                      # blueprint 384×6 reduced to ~3.3M params/stream for the 4 GB GPU
  layers: 4
  heads: 4
  pose: {d_model: 128, layers: 2, input_dim: 44}
  prototypes: 4096
  crops: {n_global: 2, n_local: 6, global_len: [24, 48], local_len: [6, 16], chunk_len: 96, speed: [0.8, 1.25]}
  views: different cache versions per view (base/aug1/aug2) or all-flip (p=0.25)
  mask: {type: frame_only, ratio: [0.3, 0.5]}
  loss: {dino: 1.0, ibot: 1.0, koleo: 0.1, gram: 2.0, gram_from: 0.75}
  temp: {teacher: [0.04, 0.07], student: 0.1, warmup_frac: 0.3}
  ema: [0.994, 1.0]
  optim: {lr: 5.0e-4, wd: 0.04, batch: 48, steps: 6000, precision: bf16}
  sampling_weights: {ttrs_active_only: 0.35, youtube: 0.65}

islr:                               # tag islr_ssl_fast (selected)
  init: ssl_v1
  streams: [hand_l, hand_r, pose]   # face stream dropped: strongest signer-identity carrier
  embed_dim: 512
  loss: {supcon_temp: 0.07, arcface_margin: 0.2, arcface_scale: 30, signer_adversary_lambda: 0.5}
  finetune: full                    # LoRA r4 was worse (E2 test R@5 0.553 vs 0.658)
  optim: {lr: 3.0e-4, enc_lr: 1.0e-4, steps: 1500, P: 96, views_per_class: 2}
  views: {versions: [base, aug1, aug2, flip], temporal_keep: [0.8, 1.0], speed: [0.8, 2.5], stream_dropout: 0.1}
  selection: val MRR(E1) + MRR(E1, centred) + 0.05·E2 R@5

face:
  teacher: trpakov/vit-face-expression
  head: temporal conv on frozen face-stream features, KL distillation, 1500 steps
  data: 300 TTRS train clips + 80% YouTube clips (first 30 s), labels every 2nd frame
