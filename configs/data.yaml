schema_version: "2.1"
fps: 12.5
crop_from_native_res: true
crop_size: 112                      # encoder input (edge profile) — 224 ablated in evaluation (T18)

articulators:
  det:  {model: yolox_tiny_8xb8-300e_humanart-6f3252f9.onnx, input: [416, 416], every_n_frames: 8, score_thr: 0.35, max_persons: 3}
  pose: {model: rtmpose-s_simcc-body7_pt-body7_420e-256x192-acd4a1ef_20230504.onnx, input: [192, 256]}
  box_ema: 0.6
  crops:
    hand: {center_shift: 0.30, side_ratio: 1.1, pad: 1.4, min_side_shoulder: 0.45}
    face: {side_ratio_ears: 2.2, pad: 1.2, min_side_shoulder: 0.55}
  min_kpt_conf: 0.3

signer_lock: {switch_ratio: 1.3, switch_patience: 2, weights: {wrist_conf: 0.5, size: 0.3, zone: 0.2}}   # size replaces motion: candidates are scored on detection frames (no track history)
active_segment: {raise_thr: 0.15, move_thr: 0.12, dilate: 1}   # move_thr 0.03 (blueprint) < measured RTMPose wrist jitter at rest (0.03–0.06 sw/frame)

ttrs:
  caption_band_frac: 0.85
  logo_box: [0.82, 0.0, 1.0, 0.17]
  chroma_hsv_lo: [92, 110, 140]
  chroma_hsv_hi: [110, 255, 255]
  fill_bgr: [200, 140, 40]          # chroma blue, so masked regions are keyed out by the bg-replacement aug
layouts:
  bigsign_vertical: {signer_zone: [0.0, 0.45, 1.0, 1.0]}

youtube:
  max_seconds_per_video: 300        # SSL pool cap per video: 12.9 h over 288 videos (diversity > a few long broadcasts)
  skip_intro_s: 10

cache:
  backbone: facebook/dinov2-small   # DINOv3 is gated (no HF_TOKEN) + needs transformers>=4.56 → blueprint fallback
  store: [cls, patch_mean]
  dtype: float16
  versions_ttrs: [base, flip, aug1, aug2]
  versions_other: [base, aug1]

splits: {seed: 42, ttrs_pairs_val_test: [0.5, 0.5]}
sampling_weights: {ttrs: 0.35, youtube_word: 0.30, youtube_sentence: 0.10, bigsign: 0.25, song_factor: 0.5}
