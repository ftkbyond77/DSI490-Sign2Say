profile: edge                      # 112 px crops, DINOv2-S (DINOv3 gated → fallback)
device: auto
checkpoint: artifacts/checkpoints/islr/islr_ssl_fast.pt     # selected model (result_reporting/result_v1.md §6)
prototypes: artifacts/prototypes/islr_ssl_fast.npz          # all 4,742 TTRS sign variants enrolled
stream: {fps: 12.5, ring_buffer: 48, tcls_every: 2, window_lengths: [12, 20]}
video:
  window_lengths: [12, 16, 20, 24, 32]
  decoder: dp_rel                  # session-relative DP: penalty = mean top-1 window similarity + delta
  decoder_kw: {delta: 0.1}
  session_centering: true          # windows − video mean; prototypes − their signer's mean (improved E1 on val for 4/4 models)
  tta_flip: false
thresholds: {pause_s: 0.6, low_conf: 0.45}
language: {provider: openai, fallback: rules, max_tokens: 80, timeout_s: 3}   # no OPENAI_API_KEY → rules
face: {affect_head: artifacts/checkpoints/face/affect_head.pt, damp_affect_when_nmm: 0.5}
tts:
  provider: local                  # facebook/mms-tts-tha (offline)
  style_map:
    neutral:   {rate: 1.00, pitch: 0}
    happy:     {rate: 1.10, pitch: 2}
    sad:       {rate: 0.90, pitch: -2}
    angry:     {rate: 1.15, pitch: 1}
    surprised: {rate: 1.05, pitch: 3}
  persona: null
