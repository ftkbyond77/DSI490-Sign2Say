# reverse-web: the only published port of the reverse part (8081). Serves the built front end and proxies /api to reverse-api.
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { model/gltf-binary vrm vrma glb; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  sendfile on;
  client_max_body_size 10m;              # ≤ 60 s of speech
  proxy_read_timeout 90s;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 800;
  gzip_types application/json application/javascript text/css model/gltf-binary;
  server {
    listen 80;
    set $api http://reverse-api:8001;
    location /api/ {
      proxy_pass $api;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
    }
    location /assets/ {                   # hashed file names → cache forever
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /avatars/src/ {              # a character's original file while its optimised copy is being made (?v=content hash)
      alias /srv/vrm/;
      add_header Cache-Control "public, max-age=86400";
    }
    location /avatars/ {                  # optimised characters + thumbnails, content-addressed names → cache forever
      root /srv;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /avatar.vrm {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=86400";
    }
    location / {
      root /usr/share/nginx/html;
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
